services:
  kokoro-tts:
    build: .
    container_name: kokoro-wakeword-synthesizer
    runtime: nvidia          # comment out for CPU-only mode
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - WAKE_WORD=Hello Airi
      - TARGET_SAMPLES=10
      - MIN_DURATION=0.9
      - MAX_DURATION=1.3
      - BATCH_SIZE=20
      - OUTPUT_DIR=/app/output
      - TARGET_SR=16000
      - LANG_CODE=a
      - RANDOM_SEED=42
      - FORCE_CPU=false      # set true to force CPU even when GPU is present
    volumes:
      - ./scripts:/app/scripts:ro
      - ./output:/app/output
      - ./models:/app/models
    command: /app/scripts/generate_dataset.py
    deploy:                  # comment all lines below for CPU-only mode
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]